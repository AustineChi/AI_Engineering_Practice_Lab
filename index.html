<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineering Practice Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--panel2:#1b2740;--ink:#eef3ff;--muted:#9eabc4;--line:#2b3957;--accent:#8eb6ff;--good:#8ee0b1;--bad:#ff9b9b;--answer-bg:#17233a;--answer-hover:#1d2d4a;--feedback-bg:#19263c;--progress-bg:#26334e;--shadow:#0005}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6fc;--panel:#fff;--panel2:#eef3fb;--ink:#17233a;--muted:#5e6d86;--line:#d7e0ef;--accent:#315fba;--good:#176b45;--bad:#b33b48;--answer-bg:#f4f7fc;--answer-hover:#eaf0fb;--feedback-bg:#f1f5fc;--progress-bg:#e2e9f4;--shadow:#20365a18}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--accent) 12%,var(--bg)) 0,var(--bg) 60%);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:28px 14px}
main{width:min(900px,100%)}button,select{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:800}.top-actions{display:flex;align-items:center;gap:10px}.stats{color:var(--muted);font-size:13px;text-align:right}.theme-toggle,.secondary,.danger{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:650;font-size:12px;cursor:pointer}
h1{font-size:clamp(27px,5vw,39px);line-height:1.1;margin:7px 0 9px;letter-spacing:-.035em}.sub{color:var(--muted);margin:0 0 22px}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 22px 70px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.statbox{border:1px solid var(--line);background:var(--answer-bg);border-radius:14px;padding:14px}.statbox strong{display:block;font-size:25px}.statbox span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.primary,.next{border:0;border-radius:12px;padding:11px 17px;background:var(--accent);color:#0b1427;font-weight:800;font-size:14px;cursor:pointer}.secondary{border-radius:12px;font-size:13px;padding:10px 14px}.danger{border-color:#98545b;color:var(--bad);border-radius:12px;font-size:13px;padding:10px 14px}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted);font-weight:650}.field select{background:var(--answer-bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.section-title{font-size:17px;margin:22px 0 10px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.topicrow{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.topicrow:last-child{border:0}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:16px}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 10px}.progress{height:6px;background:var(--progress-bg);border-radius:99px;overflow:hidden;margin:0 0 23px}.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.question{font-size:clamp(19px,3vw,24px);font-weight:680;line-height:1.35;margin:0 0 20px}.answers{display:grid;gap:10px}.answer{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--answer-bg);border:1px solid var(--line);border-radius:13px;color:var(--ink);padding:13px 14px;font:inherit;cursor:pointer;transition:.15s}.answer:hover:not(:disabled){border-color:var(--accent);background:var(--answer-hover);transform:translateY(-1px)}.answer:disabled{cursor:default;opacity:1}.letter{flex:0 0 27px;height:27px;border:1px solid #71809c;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800}.answer.correct{border-color:#438c6c;background:color-mix(in srgb,var(--good) 16%,var(--answer-bg))}.answer.wrong{border-color:#9a5353;background:color-mix(in srgb,var(--bad) 13%,var(--answer-bg))}
.feedback{display:none;margin-top:18px;border-radius:13px;padding:15px;background:var(--feedback-bg);border:1px solid var(--line)}.feedback.show{display:block}.verdict{font-weight:800;margin-bottom:6px}.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}.explain{font-size:14px}.takeaway{font-size:13px;color:var(--muted);margin-top:9px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.hintbox{background:var(--answer-bg);border:1px dashed var(--line);border-radius:12px;padding:11px 13px;margin:12px 0;color:var(--muted);font-size:13px}.confidence{margin-top:13px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}.confidence button{border:1px solid var(--line);background:var(--answer-bg);color:var(--ink);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer}.confidence button.selected{border-color:var(--accent);outline:1px solid var(--accent)}
.finish{text-align:center}.finish h2{font-size:34px;margin:6px}.finish p{color:var(--muted)}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:18px 0}
.bookmark{background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:7px 10px;cursor:pointer;font-size:12px}.bookmark.active{color:#e6b85c;border-color:#b28a3c}
footer{color:var(--muted);font-size:11px;text-align:center;margin:17px 0}
@media(max-width:560px){body{padding:18px 10px}.top{align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{align-items:flex-end}.stats{max-width:100px}}
</style>
</head>
<body><main>
<div class="top"><div><div class="brand">AI Engineering · Practice Lab</div></div><div class="top-actions"><button class="theme-toggle" id="themeToggle">☀ Light mode</button><div class="stats" id="score">Ready to learn</div></div></div>
<h1>Build engineering instincts.</h1><p class="sub">303 questions · learn, practise, review and track your progress.</p>
<section class="card" id="app"><p class="muted">Loading question bank…</p></section>
<footer>Progress and bookmarks are saved in this browser. Works offline when launched locally with the included script.</footer>
</main>
<script>
const app=document.getElementById('app'),scoreEl=document.getElementById('score'),root=document.documentElement;
const letters=['A','B','C','D'];
let bank=[],deck=[],position=0,score=0,answered=false,mode='learn',sessionKind='all',currentQ=null;
let progress={},bookmarks=[],confidenceChoice=null,sessionResults=[];
const STORE='ai-practice-progress-v2',BOOK='ai-practice-bookmarks-v2';
function readStore(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch(e){return fallback}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(progress));localStorage.setItem(BOOK,JSON.stringify(bookmarks))}catch(e){}}
progress=readStore(STORE,{});bookmarks=readStore(BOOK,[]);
function applyTheme(t){root.dataset.theme=t;let b=document.getElementById('themeToggle');if(b)b.textContent=t==='dark'?'☀ Light mode':'☾ Dark mode';}
applyTheme((()=>{try{return localStorage.getItem('ai-practice-theme')==='light'?'light':'dark'}catch(e){return'dark'}})());
document.getElementById('themeToggle').onclick=()=>{let t=root.dataset.theme==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem('ai-practice-theme',t)}catch(e){}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function topics(){return [...new Set(bank.map(q=>q.section))].sort((a,b)=>a.localeCompare(b));}
function stats(){let vals=Object.values(progress),attempts=vals.reduce((n,x)=>n+(x.attempts||0),0),correct=vals.reduce((n,x)=>n+(x.correctCount||0),0),mastered=vals.filter(x=>x.attempts>=2&&x.correctCount/x.attempts>=.8).length,wrong=vals.filter(x=>x.lastCorrect===false).length;return{attempts,correct,mastered,wrong,accuracy:attempts?Math.round(correct/attempts*100):0};}
function dashboard(){
 const s=stats(),byTopic=topics().map(t=>{let qs=bank.filter(q=>q.section===t),done=qs.filter(q=>progress[q.id]?.attempts),right=qs.reduce((n,q)=>n+(progress[q.id]?.correctCount||0),0),att=qs.reduce((n,q)=>n+(progress[q.id]?.attempts||0),0);return{t,done:done.length,total:qs.length,acc:att?Math.round(right/att*100):0};});
 app.innerHTML=`<div class="brand">Your learning dashboard</div><h2 style="margin:7px 0 5px">Pick up where you left off.</h2><p class="muted" style="margin-top:0">Choose a mode and topic, or review the areas that need work.</p>
 <div class="grid"><div class="statbox"><strong>${s.attempts}</strong><span>Answers recorded</span></div><div class="statbox"><strong>${s.accuracy}%</strong><span>Overall accuracy</span></div><div class="statbox"><strong>${s.mastered}</strong><span>Questions showing mastery</span></div><div class="statbox"><strong>${bookmarks.length}</strong><span>Bookmarked questions</span></div></div>
 <div class="field"><label for="mode">Practice mode</label><select id="mode"><option value="learn">Learning mode — hints and immediate explanations</option><option value="exam">Exam mode — no hints or feedback until the end</option></select></div>
 <div class="field"><label for="topic">Topic</label><select id="topic"><option value="all">All topics (${bank.length} questions)</option>${topics().map(t=>`<option value="${esc(t)}">${esc(t)} (${bank.filter(q=>q.section===t).length})</option>`).join('')}</select></div>
 <div class="toolbar"><button class="primary" id="startAll">Start practice →</button><button class="secondary" id="reviewWrong">Review mistakes (${s.wrong})</button><button class="secondary" id="reviewBookmarks">Bookmarks (${bookmarks.length})</button><button class="secondary" id="dashboardBtn">Refresh dashboard</button></div>
 <div class="divider"></div><h3 class="section-title">Topic progress</h3>${byTopic.map(x=>`<div class="topicrow"><span>${esc(x.t)} <span class="muted">· ${x.done}/${x.total} attempted</span></span><strong>${x.acc}%</strong></div>`).join('')}
 <div class="toolbar"><button class="danger" id="reset">Reset all progress and start from scratch</button></div><p class="small">Reset clears saved answers, confidence ratings and bookmarks. Your light/dark theme preference is kept.</p>`;
 document.getElementById('startAll').onclick=()=>{mode=document.getElementById('mode').value;let t=document.getElementById('topic').value;startRound(bank.filter(q=>t==='all'||q.section===t),'all');};
 document.getElementById('reviewWrong').onclick=()=>{let a=bank.filter(q=>progress[q.id]?.lastCorrect===false);if(a.length)startRound(a,'mistakes');else alert('No mistakes to review yet. Complete a few questions first.');};
 document.getElementById('reviewBookmarks').onclick=()=>{let a=bank.filter(q=>bookmarks.includes(q.id));if(a.length)startRound(a,'bookmarks');else alert('No bookmarks yet. Bookmark questions while practising.');};
 document.getElementById('dashboardBtn').onclick=dashboard;
 document.getElementById('reset').onclick=()=>{if(confirm('Reset all saved answers, confidence ratings and bookmarks? This cannot be undone.')){progress={};bookmarks=[];save();dashboard();scoreEl.textContent='Fresh start';}};
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startRound(items,kind){
 if(!items.length)return;sessionKind=kind;deck=shuffle(items);position=0;score=0;answered=false;sessionResults=[];render();
}
function render(){
 answered=false;confidenceChoice=null;let base=deck[position];let order=shuffle(base.options.map((_,i)=>i));currentQ=Object.assign({},base,{options:order.map(i=>base.options[i]),answer:order.indexOf(base.answer),origId:base.id});let q=currentQ,progressPct=position/deck.length*100;
 let bookmarked=bookmarks.includes(q.id);
 app.innerHTML=`<div class="meta"><span class="pill">${esc(q.section)}</span><span>${position+1} / ${deck.length} · ${mode==='learn'?'Learning mode':'Exam mode'}</span></div>
 <div class="progress"><span style="width:${progressPct}%"></span></div><div class="meta"><span>${q.type==='scenario'?'Scenario practice':q.type==='applied'?'Applied question':q.type==='concept'?'Concept check':'Core question'}${q.source?' · '+esc(q.source):''}</span><button class="bookmark ${bookmarked?'active':''}" id="bookmark">${bookmarked?'★ Bookmarked':'☆ Bookmark'}</button></div>
 <p class="question">${esc(q.question)}</p>
 ${mode==='learn'?`<button class="secondary" id="hintBtn">Show hint</button><div class="hintbox hidden" id="hint">${esc(q.hint||(q.concept_term?'Think about the concept of "'+q.concept_term+'" and eliminate options that do not address the root cause.':'Think about the underlying principle and eliminate options that do not address the root cause.'))}</div>`:''}
 <div class="answers">${q.options.map((o,i)=>`<button class="answer" data-index="${i}"><span class="letter">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
 <div class="feedback" id="feedback" aria-live="polite"></div><div id="confidenceArea"></div>
 <div class="controls"><button class="secondary" id="home">Dashboard</button><button class="next" id="next" disabled>${position===deck.length-1?'Finish round':'Next question →'}</button></div>`;
 app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(Number(b.dataset.index)));
 document.getElementById('next').onclick=advance;document.getElementById('home').onclick=dashboard;
 document.getElementById('bookmark').onclick=()=>{if(bookmarks.includes(q.id))bookmarks=bookmarks.filter(x=>x!==q.id);else bookmarks.push(q.id);save();let b=document.getElementById('bookmark');b.classList.toggle('active',bookmarks.includes(q.id));b.textContent=bookmarks.includes(q.id)?'★ Bookmarked':'☆ Bookmark';};
 if(mode==='learn')document.getElementById('hintBtn').onclick=()=>document.getElementById('hint').classList.toggle('hidden');
 scoreEl.textContent=`Round ${score} / ${position}`;
}
function choose(index){
 if(answered)return;answered=true;let q=currentQ,correct=index===q.answer;if(correct)score++;
 let old=progress[q.id]||{attempts:0,correctCount:0};old.attempts++;if(correct)old.correctCount++;old.lastCorrect=correct;old.lastAnswer=index;old.lastSeen=new Date().toISOString();progress[q.id]=old;sessionResults.push({q,index,correct});save();
 app.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===index)b.classList.add('wrong');});
 if(mode==='learn')showFeedback(q,index,correct);
 else document.getElementById('confidenceArea').innerHTML='<p class="small">Answer recorded. Explanations will appear when the round ends.</p>';
 document.getElementById('next').disabled=false;scoreEl.textContent=`Round ${score} / ${position+1}`;
 document.getElementById('confidenceArea').innerHTML+=`<div class="confidence"><span>How confident were you?</span>${['Low','Medium','High'].map(v=>`<button data-confidence="${v}">${v}</button>`).join('')}</div>`;
 document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{confidenceChoice=b.dataset.confidence;old.confidence=confidenceChoice;progress[q.id]=old;save();document.querySelectorAll('[data-confidence]').forEach(x=>x.classList.toggle('selected',x===b));});
}
function showFeedback(q,index,correct){
 let fb=document.getElementById('feedback');fb.classList.add('show');
 fb.innerHTML=`<div class="verdict ${correct?'good':'bad'}">${correct?'✓ Correct':'✕ Not quite'} Correct answer: ${letters[q.answer]}.</div><div class="explain"><strong>Why this is right:</strong> ${esc(q.explanation)}</div>${q.concept?`<div class="takeaway"><strong>📘 Key concept — ${esc(q.concept_term)}:</strong> ${esc(q.concept)}</div>`:''}${q.practical?`<div class="takeaway"><strong>Put it into practice:</strong> ${esc(q.practical)}</div>`:''}`;
}
function advance(){if(!answered)return;position++;if(position>=deck.length){finish();return;}render();}
function finish(){
 scoreEl.textContent=`Round complete · ${score}/${deck.length}`;let pct=Math.round(score/deck.length*100),missed=sessionResults.filter(x=>!x.correct);
 app.innerHTML=`<div class="finish"><div class="brand">${sessionKind==='mistakes'?'Mistake review complete':sessionKind==='bookmarks'?'Bookmark review complete':'Practice round complete'}</div><h2>${pct}%</h2><p>You answered <strong>${score}</strong> correctly out of ${deck.length}.</p><p>${pct>=85?'Strong round. Keep testing yourself on the harder scenarios.':pct>=65?'Good progress. Review the explanations and retry the missed concepts.':'Use this as a baseline. Work through the explanations, then try the same topic again.'}</p>
 <div class="grid"><div class="statbox"><strong>${missed.length}</strong><span>Questions missed</span></div><div class="statbox"><strong>${stats().mastered}</strong><span>Questions showing mastery</span></div></div>
 <div class="toolbar" style="justify-content:center"><button class="primary" id="reviewSession">Review missed questions (${missed.length})</button><button class="secondary" id="again">Practise this set again</button><button class="secondary" id="home">Dashboard</button></div>
 <div id="examReview"></div></div>`;
 document.getElementById('reviewSession').onclick=()=>{if(missed.length)startRound(missed.map(x=>x.q),'mistakes');else alert('No missed questions in this round.');};
 document.getElementById('again').onclick=()=>startRound(deck,'all');document.getElementById('home').onclick=dashboard;
 if(mode==='exam'&&missed.length){document.getElementById('examReview').innerHTML='<div class="divider"></div><h3 class="section-title">Exam review</h3>'+missed.map(x=>`<div class="topicrow" style="display:block"><strong>${esc(x.q.question)}</strong><p class="small">Correct answer: ${letters[x.q.answer]}. ${esc(x.q.explanation)}</p>${x.q.concept?`<p class="small">📘 <strong>${esc(x.q.concept_term)}:</strong> ${esc(x.q.concept)}</p>`:''}</div>`).join('');}
}
async function init(){try{let r=await fetch('./questions.yaml');if(!r.ok)throw Error('Could not load questions.yaml (HTTP '+r.status+').');let d=JSON.parse(await r.text());if(!d.questions||!d.questions.length)throw Error('The question bank is empty.');bank=d.questions;dashboard();}catch(e){app.innerHTML=`<div style="text-align:center;color:var(--bad)"><h2>Could not load the question bank</h2><p>${esc(e.message)}</p><p>If you opened index.html directly from disk, use the Start Quiz script or the hosted GitHub Pages site instead.</p></div>`;}}
init();
</script></body></html>
